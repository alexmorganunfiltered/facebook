<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      color: #222;
    }
  </style>
</head>
<body>
  <p>Redirecting…</p>
  <script>
    (function () {
      fetch('site-config.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('config unavailable');
          }
          return response.json();
        })
        .then(function (config) {
          var url = config && config.facebook_page_url;
          if (!url || url.indexOf('your.page.here') !== -1) {
            document.body.textContent = 'Set your Facebook page URL in site-config.json.';
            return;
          }
          window.location.replace(url);
        })
        .catch(function () {
          document.body.textContent = 'Unable to load redirect configuration.';
        });
    })();
  </script>
</body>
</html>
